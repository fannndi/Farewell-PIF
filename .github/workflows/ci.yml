name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install cryptography
      - name: Compile python
        run: |
          python -m py_compile build.py build_app.py \
            patcher/farewell_patch.py patcher/calibrate.py \
            tools/provision.py tools/attestation_lab.py \
            tools/audit_rom.py tools/adb_debug.py tools/package.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Profile validation
        run: python tools/attestation_lab.py --profile reference/profile/Pif-props.json --out /tmp/profile.json

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch build classpath
        run: |
          mkdir -p tools/libs
          curl -sL -o tools/libs/android-all-12.jar \
            https://repo1.maven.org/maven2/org/robolectric/android-all/12-robolectric-7732740/android-all-12-robolectric-7732740.jar
          curl -sL -o tools/libs/android-31.jar tools/libs/android-all-12.jar
          curl -sL -o tools/libs/bcprov-full.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          python - <<'PY'
          import zipfile
          src = zipfile.ZipFile('tools/libs/bcprov-full.jar')
          with zipfile.ZipFile('tools/libs/bcprov-slim.jar', 'w', zipfile.ZIP_DEFLATED) as out:
              for item in src.infolist():
                  name = item.filename
                  if name.startswith('META-INF/') or name == 'module-info.class':
                      continue
                  if name.startswith(('org/bouncycastle/asn1/', 'org/bouncycastle/util/')):
                      out.writestr(item, src.read(name))
          PY
          curl -sL -o tools/r8.jar \
            https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.4.17/r8-9.4.17.jar
      - name: Build hook dex (no jar patching)
        run: python build.py --hook-only
      - name: Sideload round-trip
        run: python tools/provision.py --verify-sideload
